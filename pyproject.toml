[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesy-visualization"
dynamic = ["version"]
description = "Engine-neutral geodesy visualization backends and workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Yilun Tan", email = "csuyiluntan@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
matplotlib = [
  "matplotlib",
  "numpy",
]
pygmt = [
  "insar-data-adapter>=0.11.0",
  "numpy",
  "pandas",
  "pygmt",
  "pyproj",
  "rasterio",
]
all = [
  "insar-data-adapter>=0.11.0",
  "matplotlib",
  "numpy",
  "pandas",
  "pygmt",
  "pyproj",
  "rasterio",
]

[tool.setuptools.dynamic]
version = {attr = "geodesy_visualization.__version__"}

[tool.setuptools.packages.find]
include = ["geodesy_visualization*"]

[tool.setuptools.package-data]
geodesy_visualization = [
  "fonts/*",
  "fonts/*/*",
]
