[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesy-visualization"
dynamic = ["version"]
description = "Engine-neutral geodesy visualization backends and workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Yilun Tan", email = "csuyiluntan@gmail.com"},
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
geodesy-visualization = "geodesy_visualization.cli:main"

[project.optional-dependencies]
matplotlib = [
  "matplotlib",
  "numpy",
]
pygmt = [
  "numpy",
  "pandas",
  "pygmt",
  "pyproj",
  "rasterio",
]
all = [
  "matplotlib",
  "numpy",
  "pandas",
  "pygmt",
  "pyproj",
  "rasterio",
]

[tool.setuptools.dynamic]
version = {attr = "geodesy_visualization.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["geodesy_visualization*"]

[tool.setuptools.data-files]
"share/geodesy-visualization/config_examples/baseline_plot" = ["config_examples/baseline_plot/*.cfg"]
"share/geodesy-visualization/config_examples/baseline_plot/data" = ["config_examples/baseline_plot/data/*.json", "config_examples/baseline_plot/data/shortbaseline_3"]
"share/geodesy-visualization/config_examples/baseline_plot/matlab" = ["config_examples/baseline_plot/matlab/*.m"]
"share/geodesy-visualization/config_examples/deformation_map" = ["config_examples/deformation_map/*.cfg"]
"share/geodesy-visualization/config_examples/deformation_map/data" = ["config_examples/deformation_map/data/PSI.txt", "config_examples/deformation_map/data/SBAS.tif", "config_examples/deformation_map/data/dem.tif", "config_examples/deformation_map/data/optic.tif"]
"share/geodesy-visualization/config_examples/deformation_profile" = ["config_examples/deformation_profile/*.cfg"]
"share/geodesy-visualization/config_examples/deformation_profile/data" = ["config_examples/deformation_profile/data/ALOS2_AS.txt", "config_examples/deformation_profile/data/DEM.tif", "config_examples/deformation_profile/data/S1_AS_Add.tif", "config_examples/deformation_profile/data/S1_AS_All.tif", "config_examples/deformation_profile/data/S1_AS_Mask.tif", "config_examples/deformation_profile/data/S1_AS_Norcia.tif", "config_examples/deformation_profile/data/S1_AS_Visso.tif"]
"share/geodesy-visualization/config_examples/study_area" = ["config_examples/study_area/*.cfg"]
"share/geodesy-visualization/config_examples/study_area/data" = ["config_examples/study_area/data/*.geojson", "config_examples/study_area/data/*.kml"]
"share/geodesy-visualization/config_examples/timeseries_aux" = ["config_examples/timeseries_aux/*.cfg"]
"share/geodesy-visualization/config_examples/timeseries_aux/data" = ["config_examples/timeseries_aux/data/daily_precipitation.txt", "config_examples/timeseries_aux/data/daily_temperature.txt", "config_examples/timeseries_aux/data/deformation.txt", "config_examples/timeseries_aux/data/deformation_fit.txt"]
"share/geodesy-visualization/config_examples/timeseries_map" = ["config_examples/timeseries_map/*.cfg"]
"share/geodesy-visualization/config_examples/timeseries_map/data" = ["config_examples/timeseries_map/data/def_cum_example.xyz", "config_examples/timeseries_map/data/images.txt"]
"share/geodesy-visualization/cpt" = ["cpt/*.cpt", "cpt/*.svg"]
"share/geodesy-visualization/fonts" = ["fonts/*.txt", "fonts/README.md"]
"share/geodesy-visualization/fonts/IBMPlexMono" = ["fonts/IBMPlexMono/*.otf", "fonts/IBMPlexMono/*.txt"]
"share/geodesy-visualization/fonts/LiberationSans" = ["fonts/LiberationSans/*.ttf"]
"share/geodesy-visualization/fonts/LiberationSerif" = ["fonts/LiberationSerif/*.ttf"]
"share/geodesy-visualization/fonts/NotoSansSC" = ["fonts/NotoSansSC/*.ttf", "fonts/NotoSansSC/*.txt"]
"share/geodesy-visualization/fonts/NotoSerifSC" = ["fonts/NotoSerifSC/*.ttf", "fonts/NotoSerifSC/*.txt"]
"share/geodesy-visualization/fonts/STIXTwo" = ["fonts/STIXTwo/*.otf", "fonts/STIXTwo/LICENSE.pdf"]
"share/geodesy-visualization/fonts/TeXGyreHeros" = ["fonts/TeXGyreHeros/*.otf"]
"share/geodesy-visualization/fonts/TeXGyreTermes" = ["fonts/TeXGyreTermes/*.otf"]
