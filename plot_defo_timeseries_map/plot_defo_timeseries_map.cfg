# Spatial deformation time-series panels / 空间形变时序子图
# Run from repository root / 在仓库根目录运行：
# conda run -n envPlot python plot_defo_timeseries_map/plot_defo_timeseries_map.py \
#   --config plot_defo_timeseries_map/plot_defo_timeseries_map.cfg

# table: read the named wide table and a separate dates table.
# canonical: read Adapter canonical grid HDF5; dates_file and nan_tokens are ignored.
# table：读取带表头的宽表和独立日期表。
# canonical：读取 Adapter 标准规则栅格 HDF5；忽略 dates_file 和 nan_tokens。
data_source = table

# For table input, named columns are longitude_deg, latitude_deg, then
# epoch_NNN_deformation_YYYYMMDD_mm. The dates table maps each one-based epoch
# index to its YYYYMMDD date; repeated dates therefore remain distinguishable.
# 对于 table 输入，表头依次为经度、纬度及
# epoch_NNN_deformation_YYYYMMDD_mm；日期表将从 1 开始的时期编号映射到
# YYYYMMDD，重复日期也能保持列名唯一。
data_file = data/def_cum_example.xyz
# Two named columns: epoch_index and date_yyyymmdd.
# 两列表头：epoch_index 和 date_yyyymmdd。
dates_file = data/images.txt
# canonical only: exact input unit and geographic CRS expected in HDF5 metadata.
# data_scale is applied afterward; colorbar_unit must describe the scaled values.
# 仅用于 canonical：HDF5 元数据应具有的输入单位和地理 CRS（精确匹配）。
# 随后应用 data_scale；colorbar_unit 必须描述缩放后的数值。
canonical_unit = mm
canonical_crs = EPSG:4326
output_dir = result
output_file = deformation_timeseries_map.png

# Geographic crop and projected panel width.
# 地理裁剪范围和投影子图宽度。
region_west = 111.76
region_east = 111.854
region_south = 32.668
region_north = 32.7300
projection = M400p

subplot_rows = 3
subplot_columns = 4
# Panel width is carried by projection=M400p. The Python workflow asks GMT
# for the matching projected height instead of forcing a square subplot.
# 子图宽度由 projection=M400p 指定；高度由 GMT 根据投影自动计算。
panel_margin_x = 20p
panel_margin_y = 35p
# Extra whitespace outside GMT's tight bounding box.
# GMT 紧裁剪边界外的整图留白。
canvas_margin = 0.35c

# One-based inclusive epoch range. Selected panels must fit rows*columns.
# 时期编号从 1 开始且包含终点；子图数不得超过行数乘以列数。
start_epoch = 1
end_epoch = 12

# Explicit display multiplier applied after reading either source type. Keep 1.0
# unless the colorbar unit intentionally differs from the input unit.
# 两类数据读取后采用的显式显示倍率；除非色标单位有意不同，否则保持 1.0。
data_scale = 1.0
bar_min = -35
bar_max = 35
bar_step = 5
# Use the repository's shared deformation palette. Relative paths are resolved
# from this cfg file, so the command may be launched from any directory.
# 使用仓库公共形变色标；相对路径按本 cfg 所在目录解析。
cpt = ../cpt/jet.cpt
cpt_reverse = false
point_style = c2.5p
point_pen =

# none, optic, or dem. Set basemap_tif for optic/dem.
# 可选 none、optic 或 dem；后两者必须设置 basemap_tif。
basemap_mode = none
basemap_tif =
dem_cpt = gray
dem_bar_min = -250
dem_bar_max = 3500

# ---------- Panel titles and numbering / 标题与序号 ----------
title_prefix =
title_date_format = %Y-%m-%d
show_panel_title = true
show_panel_number = true
panel_number_style = (1)

# ---------- Coordinates / 共享坐标 ----------
# none: no coordinates; outer: bottom-row longitude + left-column latitude;
# all: longitude and latitude on every panel.
# none：关闭；outer：仅底行经度和左列纬度；all：每幅子图均显示。
coordinate_mode = outer
longitude_interval = 0.03
latitude_interval = 0.02
coordinate_format = ddd:mm
show_coordinate_grid = false

# ---------- Relative typography / 相对字体 ----------
# Actual point size = base size * font_scale * actual panel width/reference width.
# 实际字号 = 基准字号 × font_scale × 实际子图宽度/参考宽度。
font_reference_panel_width = 400p
font_scale = 1.0
font_family = Helvetica
# Master switch for every plotted text element: panel dates/numbers,
# coordinate annotations, and colorbar annotations/labels.
# 全局粗体开关：控制日期、序号、坐标刻度及色标刻度和标签。
font_bold = true
panel_title_font_size = 26
panel_number_font_size = 20
coordinate_font_size = 20
colorbar_annotation_font_size = 14
colorbar_label_font_size = 16

# table: maximum records per Pandas read; canonical: requested grid rows per GMT
# batch, additionally capped by the canonical consumer's memory ceiling.
# table：Pandas 每次读取的最大记录数；canonical：每批交给 GMT 的规则栅格
# 行数，并继续受 canonical 消费层内存上限约束。
chunk_rows = 250000
# Comma-separated missing-value tokens in the wide table.
# 宽表中的缺测值标记，使用英文逗号分隔。
nan_tokens = nan,NaN,-9999
add_colorbar = true
colorbar_label = Deformation
colorbar_unit = mm
colorbar_interval = 10
colorbar_width = 14c
colorbar_height = 0.5c
colorbar_offset = 0c/2c
#colorbar_box = F+gwhite+p1p+c10p/8p
colorbar_box = false

# Raster output resolution. PDF/SVG outputs remain vector graphics.
# 栅格图分辨率；PDF/SVG 输出仍保持矢量。
output_dpi = 600

default_font_title = 16p,Helvetica-Bold
default_font_annot_primary = 10p,Helvetica-Bold
default_font_annot_secondary = 10p,Helvetica-Bold
default_font_label = 12p,Helvetica-Bold
