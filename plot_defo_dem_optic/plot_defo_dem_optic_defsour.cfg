# Defsour deformation map example / Defsour 形变地图示例
# Run / 运行:
# python plot_defo_dem_optic/plot_defo_dem_optic.py \
#   --config plot_defo_dem_optic/plot_defo_dem_optic_defsour.cfg

# Defsour is a headerless four-column table:
# X  Y  elevation  deformation
# Defsour 为无表头四列表：X、Y、高程、形变。
sbas_input_type = defsour
sbas_input_path = /path/to/Defsour/D20200101
sbas_input_crs = EPSG:32605
# Zero-based deformation column. The standard Defsour value is column 3.
# 形变列采用零基编号，标准 Defsour 形变为第 3 列。
sbas_deformation_column = 3
sbas_scale = 1.0
# Spacing is in WGS84 degrees after coordinate transformation.
# 坐标转换到 WGS84 后的格网间距，单位为度。
sbas_space = 0.002
sbas_chunk_rows = 250000
sbas_grd = defsour.grd
sbas_nan_to_zero = false
sbas_title = Defsour deformation
sbas_defo_mode = scatter
sbas_basemap_mode = dem

# DEM or optical basemaps should cover the same WGS84 map region.
# DEM 或光学底图需覆盖同一 WGS84 地图区域。
dem_tif = /path/to/dem.tif
optic_tif =
output_dir = result
output_sbas = defsour_map.png
projection = M8i

# CPT accepts a GMT built-in name or a .cpt path relative to this cfg.
# CPT 可填写 GMT 内置名称，或相对本 cfg 的 .cpt 文件路径。
defo_cpt = ../cpt/saga-01.cpt
defo_cpt_reverse = false
defo_bar_min = -5
defo_bar_max = 5
defo_colorbar_label = LOS deformation
defo_colorbar_unit = cm
defo_transparency = 0
scatter_style = c0.05c
scatter_pen = 0.01p,white

dem_cpt = gray
dem_bar_min = 0
dem_bar_max = 4200
# Shared metadata keys: add_colorbar, defo_colorbar_label/unit. Geometry stays
# workflow-owned. / 共享色标元数据采用上述三类键，几何仍由工作流负责。
add_colorbar = true
add_scale = true
add_rose = true
