# InSAR temporal-perpendicular baseline network visualization
# InSAR 时间—垂直基线网络图
#
# Purpose / 功能：
#   Read a completed Geodesy-Analysis baseline_manifest.json and draw its
#   selected acquisition/pair network. This command never invokes GAMMA.
#   读取 Geodesy-Analysis 已完成的 baseline_manifest.json，绘制影像
#   日期与干涉对网络；本命令不会调用 GAMMA。
#
# Usage / 调用（可从任意目录执行）：
#   /absolute/envPlot/bin/geodesy-visualization-insar-baseline \
#     --config /absolute/PROJECT/config/visualization/baseline_plot.cfg \
#     --case ascending
#
# Completion / 完成判断：
#   Exit code 0, "[baselineplot] wrote ...", and a non-empty configured PNG.
#   命令返回 0，输出上述成功信息，且 output 是非空 PNG。

[project]
# Project root; a relative value starts from this cfg directory.
# 项目根目录；相对路径以当前 cfg 所在目录为基准。
root = ../..

[defaults]
# Positive output resolution in dots per inch. / PNG 分辨率，正整数。
dpi = 300

# Positive width and height in inches. / 图幅宽、高（英寸）。
figsize = 10.5, 6.2

# Non-negative extra vertical margins in metres. / y 轴上、下额外留白（米）。
y_top_extra = 50
y_bottom_extra = 0

# Bundled or system Matplotlib font. / 内置或系统 Matplotlib 字体。
font_family = TeX Gyre Heros

# Default title; a case may override it. / 默认图标题，case 可覆盖。
title = Perpendicular Baselines History

[case:ascending]
# Required completed Analysis manifest, relative to [project] root.
# 必需：Analysis 已完成的基线清单，相对于项目根目录。
baseline_manifest = ANALYSIS/GAMMA/ascending/BASELINE/baseline_manifest.json

# Required final PNG, relative to [project] root.
# 必需：最终 PNG 路径，相对于项目根目录。
output = VISUALIZATION/INSAR/ascending/BASELINE/baseline_network.png

# Optional case-specific title. / 可选：当前 case 的图标题。
title = Ascending SBAS baseline network
