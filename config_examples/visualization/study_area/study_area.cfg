# Generic study-area and data-footprint example.
# Figure operation sections execute from top to bottom.

[project]
processing_root = .

[figure]
layout = publication_sidecar

[figure.basemap]
region = 12.8, 14.0, 42.6, 43.4
projection = M16c
frame = af
title = Study Area and Data Footprints
font_title = 28p,Helvetica-Bold
font_annot_primary = 14p,Helvetica-Bold
font_label = 28p,Helvetica-Bold

[figure.grdimage.dem]
grid = ../deformation_map/data/dem.tif
cmap = gray
series = 0/5000/1000
continuous = yes
shading = +d

[figure.plot.faults]
data = data/faults.geojson
kinematic_field = kinematics
pen = 1.5p,black
fallback_pen = 1p,gray50

[figure.plot.footprint.reference]
data = data/reference_footprint.kml
pen = 3p,red
label = Reference image footprint

[figure.plot.footprint.slaves]
data = data/slave_footprints.kml
pen = 2p,blue
label = Slave image footprints

[figure.meca.mainshock]
longitude = 13.45
latitude = 42.95
strike = 155
dip = 47
rake = -87
magnitude = 6.0
depth_km = 8.0
scale = 0.6c
compressionfill = black
extensionfill = white
pen = 1p,black

[figure.scalebar]
# External top-left map furniture; edit the offset without changing the renderer.
position = JTL+jBL+o0.5c/2.2c
length = 50k
fancy = yes
unit = yes

[figure.directional_rose]
# External top-right map furniture.
position = JTR+jBR+o-0.5c/2.2c
width = 2c

[figure.colorbar.dem]
source = figure.grdimage.dem
position = BC
length = 8c
width = 0.35c
orientation = horizontal
label = Elevation
unit = m
annot = 1000
tick = 1000
font_annot_primary = 10p,Helvetica-Bold
font_label = 12p,Helvetica-Bold

[figure.inset.globe]
position = JTR+jTL+o0.8c/0c
width = 4c
highlight = IT
land = gray90
water = white
highlight_fill = gray
show_grid = yes

[figure.inset.regional]
position = JTR+jTL+o0.8c/-4.8c
width = 5c
regions = IT
buffer = 3
land = gray90
water = white
highlight_fill = gray
highlight_pen = 0.8p,white

[figure.legend]
position = BC
box = yes
width = 14c
font = 9p,Helvetica
# Vertical spacing between entries and padding inside the legend frame.
row_gap = 0.1c
padding = 0.25c

[figure.savefig]
fname = result/study_area.png
dpi = 300
crop = yes
