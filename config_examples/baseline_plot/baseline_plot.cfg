# LT-1 temporal-perpendicular baseline plot reference
# LT-1 时间—垂直基线绘图参考配置
#
# Purpose / 功能：
#   Reproduce the accepted Jishishan LT-1 MATLAB baseline figure from one
#   completed Analysis manifest. Python and MATLAB read this same CFG.
#   使用同一份 CFG 驱动 Python 与 MATLAB，复刻积石山 LT-1 基线图。
#   Neither command invokes GAMMA or changes the baseline network.
#   两个命令均不会调用 GAMMA，也不会修改基线网络。
#
# Python usage / Python 调用（安装仓库后可在任意目录执行）：
#   conda run -n envPlot geodesy-visualization baseline_plot \
#     --config config_examples/baseline_plot/baseline_plot.cfg --dry-run
#   conda run -n envPlot geodesy-visualization baseline_plot \
#     --config config_examples/baseline_plot/baseline_plot.cfg
#
# MATLAB usage / MATLAB 调用（仓库根目录）：
#   matlab -batch "addpath('config_examples/baseline_plot/matlab'); \
#     baseline_plot_from_cfg('config_examples/baseline_plot/baseline_plot.cfg','lt1')"
#
# Python bundled font / Python 仓库字体：
#   fonts/TeXGyreHeros/texgyreheros-regular.otf
# MATLAB FreeSans system check / MATLAB FreeSans 系统检查：
#   fc-match FreeSans
#   MATLAB R2022b batch listfonts may omit user fonts even when rendering works.
#   MATLAB R2022b 批处理的 listfonts 可能漏报用户字体，不能作为渲染依据。
#
# Completion / 完成判断：
#   Python and MATLAB print "[baseline_plot] wrote ..." and the output path.
#   The configured PNG exists and is non-empty. Existing output is replaced.
#   命令返回成功、输出对应路径，且所配置 PNG 非空；已有结果会被覆盖。

[project]
# Project product paths use this root. python_font_dir is resolved from the CFG.
# 项目产品路径使用该 root；python_font_dir 则相对于 CFG 文件解析。
root = .

[defaults]
# PNG resolution and figure width,height in inches.
# PNG 分辨率以及图幅宽、高（英寸），均必须为正数。
dpi = 300
figsize = 12.5, 9.72

# Extra y-axis margins in metres, added after automatic data padding.
# 自动数据留白之外额外增加的 y 轴上、下边距（米），必须非负。
y_top_extra = 0
y_bottom_extra = 0

# Python registers the repository font directory explicitly. This path is
# relative to this CFG; the resolved directory is Geodesy-Visualization/fonts/TeXGyreHeros.
# Python 显式注册仓库字体目录；本相对路径最终指向
# Geodesy-Visualization/fonts/TeXGyreHeros。
python_font_dir = ../../fonts/TeXGyreHeros

# MATLAB uses its own system/user font and does not read python_font_dir.
# MATLAB 独立使用系统/用户字体，不读取 python_font_dir。
matlab_font_family = FreeSans

# Title/xlabel/ylabel share one size; ticks and legend are independent.
# 标题与横纵坐标名称共用字号；刻度和图例字号分别控制。
title_label_font_size = 18
tick_font_size = 16
legend_font_size = 14

# Accepted values: normal or bold. / 可选 normal 或 bold。
font_weight = bold

# Figure text. / 图题、横轴名称、纵轴名称。
title = Baselines Distribution
xlabel = SLC Images Acquire Date
ylabel = Perpendicular Baselines (m)

# Date labels: tokens %Y %m %d; unit day/month/year; positive interval.
# 日期格式仅使用 %Y、%m、%d；单位为 day/month/year；间隔必须为正整数。
date_format = %Y-%m
date_tick_unit = month
date_tick_interval = 3

# Date-label rotation in degrees, from -360 to 360.
# 日期刻度文字旋转角度，范围 -360 到 360。
date_tick_rotation = 0

# Positive y-axis major tick interval in metres. / y 轴主刻度间隔（米）。
y_tick_interval = 100

# Colors must use #RRGGBB. / 颜色统一使用 #RRGGBB。
line_color = #333333
slave_color = #0000FF
reference_color = #FF0000
grid_color = #D9D9D9

# Boolean: true/false, yes/no, on/off, or 1/0.
# 是否显示主格网。
show_grid = true

# Legend text. / 图例文字。
line_label = perpendicular baselines
slave_label = LT-1 slave image
reference_label = LT-1 reference image

[case:lt1]
# Case identifier. A cfg containing multiple [case:<name>] blocks must be run
# with --case <name>; this single-case example is selected automatically.
# case 是结果实例名；多 case 配置必须使用 --case <name>，本单 case 示例会自动选择。
# Completed Analysis-compatible manifest and its adjacent four-column network.
# 已完成的 Analysis 兼容 manifest，以及其相邻的四列基线网络。
baseline_manifest = data/baseline_manifest.json

# Python and MATLAB write separate files for direct comparison.
# Python 与 MATLAB 分别输出，便于直接对比。
output = result/baseline_plot_python.png
matlab_output = result/baseline_plot_matlab.png
