# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：Deformation profiles / 形变剖面
# RUN / 运行：在仓库根目录使用 envPlot；从其他目录运行时填写 CFG 的绝对路径。
#   conda run -n envPlot geodesy-visualization deformation-profile \
#     --config config_examples/deformation_profile/deformation_profile.cfg --dry-run
#   conda run -n envPlot geodesy-visualization deformation-profile \
#     --config config_examples/deformation_profile/deformation_profile.cfg
# INPUTS / 输入：两套形变数据、共享底图和剖线坐标。
# OUTPUTS / 输出：output_dir 或方法根 FIGURES/PUBLICATION/DEFORMATION_PROFILE。
# RERUN / 重跑：每张图绘制成功后替换同名图片。

# deformation_profile.cfg
#
#
# 本流程比较两套形变数据，并沿相同剖线输出折线图和散点图。
# This workflow compares two deformation datasets along the same named tracks.
# 地图和剖面均编译为与 footprint 工作流一致的有序 LayerOperation；这里仍只
# 需要填写剖面领域参数，不需要手写底层 figure.* sections。
# Maps and profiles compile to the same ordered LayerOperation model as footprint;
# users keep this compact profile-oriented vocabulary.
# 布尔开关不区分大小写。真值为 true/yes/y/on/1，假值为 false/no/n/off/0。
# Boolean switches ignore case. True values are true/yes/y/on/1, and false values are false/no/n/off/0.
# 所有相对路径均以本 cfg 所在目录为基准。
# project_root + project define the processing project; "." preserves this example layout.
# project_root + project 定义处理项目；"." 保持当前示例目录结构不变。
project_root = .
project = .
# 方法目录；正式项目设置后可省略 output_dir，自动写入 FIGURES/PUBLICATION/DEFORMATION_PROFILE。
# processing_root = S1/ASCENDING_128/GAMMA_mb

# =============================================================================
# 1. 地图输出与底图 / Map output and basemap
# =============================================================================
# 图件输出目录。相对路径以 project_root/project 为基准。
output_dir = result
# 地图和剖面 PNG 的输出分辨率，单位 dpi，必须为正整数。
output_dpi = 300
# GMT 投影；M8i 表示宽度 8 inch 的 Mercator 地图。
projection = M8i

# 地图经纬度主刻度间隔，单位为十进制度；留空按当前地图范围三等分。
map_longitude_interval =
map_latitude_interval =
# GMT 地理注记格式，例如 ddd:mm:ss 为度分秒，ddd:mm 为度分。
map_coordinate_format = ddd:mm:ss
# true 绘制经纬格网；false（默认）保留边框与经纬度刻度。
map_show_grid = false
# 叠加在栅格上面的主格网画笔，只有 map_show_grid=true 时使用。
map_grid_pen = 0.5p,gray45
# GMT 地图边框类型可用 fancy（默认）、fancy-rounded（亦可写 fancy+）、
# plain（普通）或 inside（注记朝内）。graph 和 graph-origin 用于笛卡尔投影。
map_frame_type = fancy
# 花式边框宽度为正长度，如 6p；auto 由 GMT 按图幅尺寸缩放。
map_frame_width = 6p
# 普通边框画笔和刻度画笔用 线宽[,颜色[,线型]]，也可用 GMT 的 auto。
map_frame_pen = 3p
map_tick_pen = 3p

# DEM 路径、色带及高程显示上下限（此示例以米为单位）。
dem_tif = data/DEM.tif
dem_cpt = gray
dem_bar_min = 700
dem_bar_max = 2300

# CPT 可填写 GMT 内置名称，或相对本 cfg 的 .cpt 文件路径。
defo_cpt = ../../cpt/seismic.cpt
# true 反转色带；false（默认）保持原顺序。
defo_cpt_reverse = false
# 数值范围采用缩放后的形变单位。
defo_bar_min = -0.1
defo_bar_max = 0.1
# 地图形变图层透明度，0 为不透明，100 为全透明。
defo_transparency = 25
# 形变色标的量名与物理单位。
defo_colorbar_label = Deformation
defo_colorbar_unit = m/yr
# 色标主刻度间隔须为正，单位与色标一致；留空或填 0 由 GMT 选取。
defo_colorbar_tick_interval =
# 色标在底部居中外侧（JBC）；+o 为偏移，+w 为长度/厚度，+h 为水平。
defo_colorbar_position = JBC+o0c/4c+w12c/0.6c+h
# 色标面板填充、边框和内边距；留空关闭面板。
defo_colorbar_box = F+gWHITE+p2p+c20p/20p
# 色标刻度数字的完整 GMT 字体规格。
defo_colorbar_font_annot_primary = 20p,Helvetica-Bold,black
# 色标量名和单位的字体；留空沿用地图的 map_font_label。
defo_colorbar_font_label =

# true（默认）在形变地图上绘制色标；false 隐藏色标。
add_colorbar = true
# true（默认）绘制比例尺并使用 map_scale*；false 隐藏。
add_scale = true
# true（默认）绘制指北针并使用 map_rose*；false 隐藏。
add_rose = true
# map_rose 用 GMT 语法定义锚点、偏移、宽度和样式。
# JMR 位于右侧中部，+jCM 为居中对齐，+o 水平/垂直偏移，+w 为宽度。
# +l 绘制方位字母；省略 +f 时为普通样式，+f1、+f2、+f3 逐级增加方位。
map_rose = JMR+jCM+o10c/0c+w5c+l+f1
# 指北针的面板填充、边框和内边距；留空关闭面板。
map_rose_box = F+gwhite+p2p+c1.5c
# 方位字母字号；留空沿用地图标题字号。字形由 GMT 指北针固定。
map_rose_label_size =

# JTC 在主图上方居中；+o 给出偏移量，+w10k 为 10 km，+f 分段，+u 显示单位。
map_scale = JTC+o0c/4c+w10k+f+u
# 比例尺面板填充、边框和内边距。
map_scale_box = F+gWHITE+p2p+c20p/20p
# 尺条本体高度，单位为点。
map_scale_height = 20p
# 比例尺刻度数字字体。可填完整字体规格，如 20p,Helvetica-Bold,black。
map_scale_font_annot = 20p,Helvetica-Bold,black
# 独立比例尺标题字体；在 map_scale 中可用 +l文字 启用独立标题。
map_scale_font_label = 20p,Helvetica-Bold,black

# =============================================================================
# 2. 数据集 1 / Dataset 1
# =============================================================================
# 剖面图例名称和地图标题。
dataset1_label = S1
dataset1_title = Deformation: S1_AS_Norcia
# tif（默认）读取 GeoTIFF；txt 读取带表头的点表。
dataset1_input_type = tif
dataset1_input_path = data/S1_AS_Norcia.tif
# 转换后的 GMT 网格路径；scale 是写入网格前的数值倍率。
dataset1_grd = S1_AS_Norcia.grd
dataset1_scale = 1
# Visualization 不执行重投影；TIF 必须自带 CRS，且与该目标 CRS 一致。
dataset1_target_crs = EPSG:4326
# TXT 坐标 CRS 和形变列编号（从 1 开始）；两数据集的选项相同。
# dataset1_input_crs = EPSG:4326
# dataset1_deformation_column = 3
# 仅 tif 使用。true（默认）将 nodata/NaN 写为 0；false 保留为空值。
dataset1_nan_to_zero = true
# txt 网格间距（度）和每批读取行数。
dataset1_space = 0.003
dataset1_chunk_rows = 250000
# 输出目录下的地图文件名。
dataset1_output_map = S1_AS_Norcia.png

# 剖面折线和散点样式 / Profile line and scatter styles
dataset1_line_pen = 2p,#1f77b4
dataset1_scatter_style = c0.32c
dataset1_scatter_fill = #1f77b4
dataset1_scatter_pen = 0.5p,#1f77b4
dataset1_scatter_transparency = 35

# =============================================================================
# 3. 数据集 2 / Dataset 2
# =============================================================================
# 剖面图例名称和地图标题。
dataset2_label = ALOS2
dataset2_title = Deformation: ALOS2_AS
# tif（默认）读取 GeoTIFF；txt 读取带表头的点表。
dataset2_input_type = txt
# TXT headers are lon, lat, deformation_cm_per_year. dataset2_scale=0.01
# converts the source cm/yr values to the plotted m/yr values.
# TXT 表头为 lon、lat、deformation_cm_per_year；dataset2_scale=0.01
# 将源数据的 cm/yr 转换为绘图使用的 m/yr。
dataset2_input_path = data/ALOS2_AS.txt
dataset2_grd = ALOS2_AS.grd
dataset2_scale = 0.01
# 目标 CRS，以及 TXT 坐标 CRS 和形变列编号（从 1 开始）。
# dataset2_target_crs = EPSG:4326
# dataset2_input_crs = EPSG:4326
# dataset2_deformation_column = 3
# 输入表必须已是 EPSG:4326；使用 lon/lat 后的第一个具名值列。
# 仅 tif 使用。true（默认）将 nodata/NaN 写为 0；false 保留为空值。
dataset2_nan_to_zero = true
# txt 网格间距（度）和每批读取行数。
dataset2_space = 0.003
dataset2_chunk_rows = 250000
# 输出目录下的地图文件名。
dataset2_output_map = ALOS2_AS.png

# 剖面折线画笔及散点符号、填充、描边、透明度（0–100）。
dataset2_line_pen = 2p,#d62728
dataset2_scatter_style = t0.34c
dataset2_scatter_fill = #d62728
dataset2_scatter_pen = 0.5p,#d62728
dataset2_scatter_transparency = 35

# =============================================================================
# 4. 剖线与地图标记 / Profile tracks and map marker
# =============================================================================
# 坐标格式：lon,lat; lon,lat。起点、终点和名称数量必须一致。
# track_num_points 为每条剖线（含起终点）的采样点数，必须至少为 2。
track_start_coords = 12.97,42.91; 12.97,42.85; 12.97,42.799; 12.97,42.75
track_end_coords = 13.35,42.93; 13.35,42.87; 13.35,42.819; 13.35,42.77
track_names = A,B,C,D
track_num_points = 100

# 地图上剖线画笔与端点文字字体。
track_line_pen = 2p,black
track_label_font = 20p,Helvetica-Bold
# 端点文字的 GMT 对齐代码可用 TL、TC、TR、ML、MC、MR、BL、BC、BR。
track_start_justify = BR
track_end_justify = BL
# 后缀仅附加于终点文字。
track_end_suffix = '

# marker_lon 与 marker_lat 必须同时填写；两者留空可禁用标记。
marker_lon = 13.12
marker_lat = 42.84
# 地图标记的符号、描边和填充；a16p 是直径 16 点的星形。
marker_style = a16p
marker_pen = 2p,black
marker_fill =

# =============================================================================
# 5. 剖面图 / Profile figures
# =============================================================================
# 两个开关可独立设置。true（默认）输出对应的折线图或散点图；false 跳过。
export_line_profiles = true
export_scatter_profiles = true
# 各剖面标题的公共前缀、横轴名称和纵轴名称。
profile_title_prefix = Profile
profile_x_label = Distance (m)
profile_y_label = Deformation (m)
# 相对于数据范围的纵轴留白比例。0.1 表示 10%。
profile_padding = 0.1
# 笛卡尔投影 X宽/高；这里为 16 cm × 10 cm。
profile_projection = X16c/10c
# 剖面横轴、纵轴的 GMT 注记设置，无需写 x 或 y。af 自动；a500f100g500
# 表示标签每 500、短刻度每 100、格网每 500 个轴单位。
profile_x_frame = af
profile_y_frame = af
# 剖面边框画笔，格式 线宽,颜色；留空使用 GMT 默认画笔。
profile_frame_pen =
# true（默认）在启用的剖面图上显示图例并使用下方样式；false 隐藏图例。
profile_add_legend = true
# 图例字体；留空沿用剖面的 profile_font_annot_primary。
profile_legend_font =
# GMT 图例锚点和偏移。
profile_legend_position = JTR+o0.5c/-1.2c
# GMT 面板样式，例如 +gwhite+p1.5p 为白底加边线；留空可去除面板。
profile_legend_box = +gwhite+p1.5p

# =============================================================================
# 6. 字体 / Fonts
# =============================================================================
# 统一后缀为 font_title、font_annot_primary、font_label；default_* 为基础
# 样式，map_* 和 profile_* 分别覆盖地图和剖面图。
# 格式为 字号,字体名[,颜色]。每组三项依次控制标题、刻度数字和轴名。
default_font_title = 24p,Helvetica-Bold
default_font_annot_primary = 12p,Helvetica-Bold
default_font_label = 20p,Helvetica-Bold

# 地图字体依次控制标题、经纬度刻度和可选轴名。
map_font_title = 28p,Helvetica-Bold
map_font_annot_primary = 14p,Helvetica-Bold
map_font_label = 28p,Helvetica-Bold
# 地图横纵轴名称（例如 Longitude 和 Latitude），留空隐藏。
map_x_label =
map_y_label =
# 轴名相对边框的水平/垂直偏移量；负数分别向左或向下。
map_x_label_offset = 0c/-1c
map_y_label_offset = -2.3c/0c

# 剖面图字体。坐标轴名称文字由 profile_x_label 和 profile_y_label 决定。
profile_font_title = 20p,Helvetica-Bold
profile_font_annot_primary = 12p,Helvetica
profile_font_label = 16p,Helvetica
