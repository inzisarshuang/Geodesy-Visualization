# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：Deformation map / 形变地图
# RUN / 运行：在仓库根目录使用 envPlot；从其他目录运行时填写 CFG 的绝对路径。
#   conda run -n envPlot geodesy-visualization deformation-map \
#     --config config_examples/deformation_map/deformation_map.cfg --dry-run
#   conda run -n envPlot geodesy-visualization deformation-map \
#     --config config_examples/deformation_map/deformation_map.cfg
# INPUTS / 输入：SBAS/PSI 形变栅格或点表，可选 DEM、光学底图和范围标记。
# OUTPUTS / 输出：output_dir 或方法根 FIGURES/PUBLICATION/DEFORMATION_MAP。
# RERUN / 重跑：每张图绘制成功后替换同名图片。

# deformation_map.cfg
#
#
# 本配置保持面向形变制图的简洁参数；运行时会按 footprint 工作流的同一
# FigurePlan/LayerOperation 结构编译为底图、形变、标注、色标和输出图层。
# This domain-oriented cfg is compiled to the same FigurePlan/LayerOperation
# structure used by the footprint workflow.
# 布尔开关不区分大小写。真值为 true/yes/y/on/1，假值为 false/no/n/off/0。
# Boolean switches ignore case. True values are true/yes/y/on/1, and false values are false/no/n/off/0.
#
# project_root + project define the processing project; "." preserves this example layout.
# project_root + project 定义处理项目；"." 保持当前示例目录结构不变。
project_root = .
project = .
# 正式项目可改为：
# project_root = /path/to/research-project
# project = S1/ASCENDING_128
# processing_root = S1/ASCENDING_128/GAMMA_mb
# 并删除 output_dir，使输出自动进入 FIGURES/PUBLICATION/DEFORMATION_MAP。

# =============================================================================
# 1. 输出、投影与可选裁剪范围 / Output, projection, and optional map region
# =============================================================================
# deformation（默认）输出 SBAS/PSI 形变图；coverage 输出覆盖与 GNSS 定位图。
# Choose deformation (default) for SBAS/PSI or coverage for footprints and GNSS sites.
map_mode = deformation

# 显式 output_dir 优先；相对路径以 project_root/project 为基准。
# Explicit output_dir is resolved from project_root/project.
output_dir = result
# 栅格输出分辨率，单位 dpi，必须为正整数。
output_dpi = 300
# GMT 投影字符串；M8i 表示宽度 8 inch 的 Mercator 地图。
projection = M8i

# 地图经纬度主刻度间隔，单位为十进制度；留空按当前地图范围三等分。
map_longitude_interval =
map_latitude_interval =
# GMT 地理注记格式，例如 ddd:mm:ss 为度分秒，ddd:mm 为度分。
map_coordinate_format = ddd:mm:ss
# true 绘制经纬格网；false（默认）保留边框与经纬度刻度。
map_show_grid = false
# 叠加在栅格上面的主格网画笔，只有 map_show_grid=true 时使用。
map_grid_pen = 0.5p,gray45
# GMT 地图边框类型可用 fancy（默认）、fancy-rounded（亦可写 fancy+）、
# plain（普通）或 inside（注记朝内）。graph 和 graph-origin 用于笛卡尔投影。
map_frame_type = fancy
# 花式边框宽度为正长度，如 6p；auto 由 GMT 按图幅尺寸缩放。
map_frame_width = 6p
# 普通边框画笔和刻度画笔用 线宽[,颜色[,线型]]，也可用 GMT 的 auto。
map_frame_pen = 3p
map_tick_pen = 3p

# 可选路径变量，可在后续路径中写 ${input_dir}；未使用时可不填写。
# input_dir = data

# deformation 模式下四项全空会采用形变 GRD 范围；coverage 模式必须四项全填。
# Deformation mode may derive the grid extent; coverage mode requires all four.
region_west =
region_east =
region_south =
region_north =

# 可选 KML 多边形裁剪。只裁剪形变层，底图仍按 region_* 绘制。
# Optional KML polygon clip for the deformation layer; basemaps use region_*.
clip_kml =

# =============================================================================
# 2. 底图 / Basemaps
# =============================================================================
# 每个数据集可在 *_basemap_mode 中选择 dem 或 optic。
# 对应模式被使用时，下面相应路径为必填。
dem_tif = data/dem.tif
optic_tif = data/optic.tif

# DEM 色带、显示最小值和最大值；数值单位必须与 DEM 一致。
dem_cpt = gray
# DEM 色带下限和上限；高程栅格通常以米为单位。
dem_bar_min = 700
dem_bar_max = 2300

# =============================================================================
# 3. 形变显示 / Deformation display
# =============================================================================
# 色带范围只控制显示，不修改源数据。单位应与 *_scale 之后的数据一致。
# CPT 可填写 GMT 内置名称，或相对本 cfg 的 .cpt 文件路径。
defo_cpt = ../../cpt/saga-01.cpt
# true 反转色带；false（默认）保持原顺序。
defo_cpt_reverse = false
# 颜色映射下限和上限，使用缩放后的形变单位。
defo_bar_min = -0.06
defo_bar_max = 0.06
# 形变图层透明度，0 为不透明，100 为全透明。
defo_transparency = 25
# 色标名称、单位和主刻度间隔；间隔须为正，留空或填 0 由 GMT 选取。
defo_colorbar_label = Deformation
defo_colorbar_unit = m/yr
defo_colorbar_tick_interval =
# 色标在底部居中外侧（JBC）；+o 为偏移，+w 为长度/厚度，+h 为水平。
defo_colorbar_position = JBC+o0c/4c+w12c/0.6c+h
# 色标面板填充、边框和内边距；留空关闭面板。
defo_colorbar_box = F+gWHITE+p2p+c20p/20p
# 色标刻度数字的完整 GMT 字体规格。
defo_colorbar_font_annot_primary = 20p,Helvetica-Bold,black
# 色标量名和单位的字体；留空沿用地图的 map_font_label。
defo_colorbar_font_label =

# defo_mode=scatter 时使用。支持 GMT 符号、画笔和 #RRGGBB 颜色。
scatter_style = c0.08c
scatter_pen = 0.01p,white

# =============================================================================
# 4. SBAS 数据集 / SBAS dataset
# =============================================================================
# deformation 模式必须填写 SBAS 输入文件。
sbas_input_path = data/SBAS.tif
# tif（默认）读取 GeoTIFF，txt 读取带表头的点表。
sbas_input_type = tif
# 转换后的 GMT 网格路径。
sbas_grd = SBAS.grd

# 写入 GRD 前的数值倍率；例如 mm -> m 可设 0.001。
sbas_scale = 1

# Visualization 不执行重投影；TIF 必须自带 CRS，且与该目标 CRS 一致。
# Visualization does not reproject; the GeoTIFF CRS must match this value.
sbas_target_crs = EPSG:4326
# TXT 坐标 CRS 和形变列编号（从 1 开始）；文本必须已为目标 CRS。
# sbas_input_crs = EPSG:4326
# sbas_deformation_column = 3

# 仅 tif 使用。true（默认）将 nodata/NaN 写为 0；false 保留为空值。
sbas_nan_to_zero = true

# TXT 专用：网格间距（度）和单次读取行数。
sbas_space = 0.0005
sbas_chunk_rows = 250000

# 地图标题。
sbas_title = Deformation: SBAS
# optic（默认）使用 optic_tif；dem 使用 dem_tif。
sbas_basemap_mode = optic
# grd（默认）绘制网格；scatter 绘制网格点并使用 scatter_* 样式。
sbas_defo_mode = grd
# 图件文件名。
output_sbas = SBAS.png

# =============================================================================
# 5. PSI 数据集（可选）/ Optional PSI dataset
# =============================================================================
# TXT 表头必须为 lon、lat 和数值列；示例第三列 deformation_m_per_year。
# TXT headers must be lon, lat, and a value column; the example value column is
# deformation_m_per_year.
# 将 psi_input_path 留空可完全禁用 PSI 图。
psi_input_path = data/PSI.txt
# txt（默认）读取带表头的点表；tif 读取 GeoTIFF。
psi_input_type = txt
# 转换后的 GMT 网格路径和值的缩放倍率。
psi_grd = PSI.grd
psi_scale = 1
# 目标 CRS，以及 TXT 坐标 CRS 和形变列编号（从 1 开始）。
# psi_target_crs = EPSG:4326
# psi_input_crs = EPSG:4326
# psi_deformation_column = 3
# TXT 必须已经是 EPSG:4326，值列为 lon/lat 后的第一个具名列。
# TXT must already be EPSG:4326; the first named column after lon/lat is used.
# 仅 tif 使用。true（默认）将 nodata/NaN 写为 0；false 保留为空值。
psi_nan_to_zero = true
# txt 网格间距（度）和每批读取行数。
psi_space = 0.0005
psi_chunk_rows = 250000
# 地图标题。
psi_title = Deformation: PSI
# dem（默认）使用 dem_tif；optic 使用 optic_tif。
psi_basemap_mode = dem
# scatter（默认）绘制网格点；grd 绘制网格。
psi_defo_mode = scatter
# 图件文件名。
output_psi = PSI.png

# =============================================================================
# 6. 地图组件 / Map components
# =============================================================================
# true（默认）绘制形变色标；false 隐藏。仅 deformation 模式使用。
add_colorbar = true
# true（默认）绘制比例尺并使用 map_scale*；false 隐藏。
add_scale = true

# true（默认）绘制指北针并使用 map_rose*；false 隐藏。
add_rose = true
# map_rose 用 GMT 语法定义锚点、偏移、宽度和样式。
# JMR 位于右侧中部，+jCM 为居中对齐，+o 水平/垂直偏移，+w 为宽度。
# +l 绘制方位字母；省略 +f 时为普通样式，+f1、+f2、+f3 逐级增加方位。
map_rose = JMR+jCM+o10c/0c+w5c+l+f1
# 指北针的面板填充、边框和内边距；留空关闭面板。
map_rose_box = F+gwhite+p2p+c1.5c
# 方位字母字号；留空沿用地图标题字号。字形由 GMT 指北针固定。
map_rose_label_size =

# GMT 比例尺位置和样式。+w10k 表示 10 km，+f 分段，+u 把单位附在刻度后。
map_scale = JTC+o0c/4c+w10k+f+u
# 面板填充、边框和内边距。
map_scale_box = F+gWHITE+p2p+c20p/20p
# 尺条厚度，单位为点。
map_scale_height = 20p
# 比例尺刻度数字及 +u 附加的单位字体。
map_scale_font_annot = 20p,Helvetica-Bold,black
# 独立比例尺标题字体；可在 map_scale 中加 +l文字 以启用。
map_scale_font_label = 20p,Helvetica-Bold,black

# map_mode=coverage 时取消下列注释并填写实际 KML。多个 footprint 路径和
# 画笔以分号分隔；coverage_pen 可只写一个，也可与 footprint 一一对应。
# Uncomment for map_mode=coverage. Separate multiple KML paths/pens with ';'.
# coverage_kml = data/reference.kml;data/slaves.kml
# GNSS KML 中的 Point Placemark 提供坐标与站名。
# gnss_kml = data/gnss_sites.kml
# 图面标题和输出文件名。
# coverage_title = Data coverage
# coverage_output = coverage.png
# 覆盖范围线宽、颜色；多条画笔以英文分号分隔。
# coverage_pen = 2p,red;2p,blue
# GNSS 站点符号及其描边画笔。
# gnss_style = c0.18c
# gnss_pen = 0.5p,white
# true 显示站名并使用下方字体和东西/南北偏移（度）；false（默认）隐藏站名。
# gnss_labels = true
# gnss_label_font = 10p,Helvetica-Bold,black
# gnss_label_offset = 0.001

# =============================================================================
# 7. 目标区域标注（可选）/ Optional target-region annotations
# =============================================================================
# 逗号分隔标签。每个标签需定义 target_<标签>_west/east/south/north。
target_regions =

# 示例（启用时同时将 target_regions = A）：
# target_A_west = -16.75
# target_A_east = -16.65
# target_A_south = 28.20
# target_A_north = 28.30
# 标签位置可用 top（默认）、bottom、left、right、northeast 或其别名 ne。
# target_A_label_position = top

# 区域椭圆描边、标签字体、标签偏移（度）及中心点符号。
target_region_pen = 1.5p,black
target_region_label_font = 12p,Helvetica-Bold,black
target_region_label_offset = 0.008
target_region_center_style = c0.08c

# =============================================================================
# 8. 字体 / Fonts
# =============================================================================
# GMT 字体格式为 字号,字体名[,颜色]。Helvetica 为常规字重，Helvetica-Bold 为粗体。
# 对每种文字，省略 map_* 时回退到对应的 default_*。以下三项分别控制标题、主刻度、轴名。
default_font_title = 24p,Helvetica-Bold
default_font_annot_primary = 12p,Helvetica-Bold
default_font_label = 20p,Helvetica-Bold

# 地图标题字体。
map_font_title = 28p,Helvetica-Bold
# 经纬度刻度数字字体。
map_font_annot_primary = 14p,Helvetica-Bold
# 横纵轴名称字体。至少填一个轴名才会在地图边框上显示该文字。
map_font_label = 28p,Helvetica-Bold
# 可选横轴名称，例如 Longitude；留空隐藏。
map_x_label =
# 可选纵轴名称，例如 Latitude；留空隐藏。
map_y_label =
# 轴名相对边框的水平/垂直偏移。负数分别向左或向下。
map_x_label_offset = 0c/-1c
map_y_label_offset = -2.3c/0c

# 兼容旧配置 / Legacy aliases:
# output_defo -> output_sbas
# defo_basemap_mode -> sbas_basemap_mode
# defo_unit -> defo_colorbar_unit
