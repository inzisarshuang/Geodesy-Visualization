# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：Deformation and auxiliary series / 形变与辅助时序
# RUN / 运行：在仓库根目录使用 envPlot；从其他目录运行时填写 CFG 的绝对路径。
# conda run -n envPlot geodesy-visualization timeseries-aux \
#   --config config_examples/timeseries_aux/timeseries_aux.cfg --dry-run
# conda run -n envPlot geodesy-visualization timeseries-aux \
#   --config config_examples/timeseries_aux/timeseries_aux.cfg
# INPUTS / 输入：两列日期和数值表，如位移、降水和温度。
# OUTPUTS / 输出：output_dir 下的时序图，或方法根 FIGURES/PUBLICATION/TIMESERIES_AUX。
# RERUN / 重跑：绘制成功后替换同名图片。

# Deformation and weather auxiliary time series / 形变与气象辅助时序图
# 布尔开关不区分大小写。真值为 true/yes/y/on/1，假值为 false/no/n/off/0。
# Boolean switches ignore case. True values are true/yes/y/on/1, and false values are false/no/n/off/0.

# Every input is a named two-column table. The first header is date_yyyymmdd;
# second headers are deformation_mm, fitted_deformation_mm,
# precipitation_mm_per_day, and temperature_celsius, respectively.
# 每个输入均为带表头的两列表；首列为 date_yyyymmdd，第二列依次为
# deformation_mm、fitted_deformation_mm、precipitation_mm_per_day 和
# temperature_celsius；日期不得重复。
# 项目根及其下的工作目录。两者为 . 时使用 CFG 所在目录。
project_root = .
project = .
# 所有相对输入路径以 project_root/project（本示例即 cfg 目录）为基准。
# 方法目录；正式项目设置后可省略 output_dir，自动写入 FIGURES/PUBLICATION/TIMESERIES_AUX。
# processing_root = S1/ASCENDING_128/GAMMA_mb
# 四个输入文件依次提供观测形变、拟合形变、日降水、日温度。
deformation_file = data/deformation.txt
fit_file = data/deformation_fit.txt
precipitation_file = data/daily_precipitation.txt
temperature_file = data/daily_temperature.txt

# The output directory is relative to project_root/project.
# 输出目录相对于 project_root/project 解析。
# 图件输出目录和该目录下的文件名。
output_dir = result
output_file = deformation_aux_timeseries.png
# 栅格图分辨率，单位 dpi，必须为正整数。
output_dpi = 300
# 可选总标题；留空隐藏，字体由 default_font_title 控制。
title =

# Shared time range and physical ranges of the three independent Y axes.
# 共享时间范围，以及形变、降水、温度三套独立纵轴范围。
# 起止日期均使用 YYYYMMDD。
date_start = 20170101
date_end = 20220101
# X宽/高为笛卡尔投影尺寸：16 cm × 5 cm。
projection = X16c/5c

# 三套纵轴范围分别使用 mm、mm/day 和 °C，最小值必须小于最大值。
defo_min = -15
defo_max = 15
precip_min = 0
precip_max = 120
temperature_min = 0
temperature_max = 40

# Series colors and axis labels. Use GMT color names or #RRGGBB.
# 序列颜色与坐标轴标题；颜色可用 GMT 名称或 #RRGGBB。
defo_color = gray20
precip_color = skyblue2
temperature_color = coral1
defo_label = Deformation (mm)
precip_label = Daily precipitation (mm)
temperature_label = Temperature (°C)
# 横轴名称。
time_label = Time (yr)

# Point/line appearance. GMT pen syntax is width,color[,style].
# 点和线样式；GMT pen 格式为宽度、颜色和可选线型。
defo_symbol = t0.13c
defo_pen = 0.5p,gray20
fit_pen = 1p,gray20
precip_pen = 0.04c,skyblue2
temperature_pen = 1p,coral1,-

# Two-level time axis: half-year dates on the primary axis and years below.
# 两级时间轴：主轴标注半年日期，次轴在下方标注年份。
# These are Cartesian time-axis GMT frame strings, not geographic coordinate
# controls. / 以下为笛卡尔时间轴 frame 字符串，不与地理坐标开关混用。
x_primary_frame = pxa6Of3o
x_secondary_frame = sxa1Y
defo_y_frame = ya10f5g10
precip_y_frame = ya30
temperature_y_frame = ya10
# 普通边框的 GMT 画笔，格式为 线宽[,颜色[,线型]]，也可用 auto。
frame_pen = 0.8p,black
# 右侧温度、降水的数字到边框的距离；温度留空采用 GMT 默认间距。
temperature_annot_offset =
precip_annot_offset = 1.4c
# 温度轴的刻度数字、轴名各自可设置完整字体；留空继承默认字体与温度颜色。
temperature_font_annot_primary =
temperature_font_label =
# 降水轴的刻度数字、轴名各自可设置完整字体；留空继承默认字体与降水颜色。
precip_font_annot_primary =
precip_font_label =
# 主时间轴日期字体，格式为 字号,字体名[,颜色]。
primary_time_font = 6p,Helvetica
# Remove the long yearly tick marks and place year labels below the date row.
# 取消年份层长刻度线，并将年份文字下移，避免与半年日期重叠。
secondary_tick_length = 0p
secondary_annot_offset = 18p

# true draws a combined legend for the four series. false (default) hides it.
# true 绘制四组序列的组合图例；false（默认）隐藏。
add_legend = false
# GMT 图例位置，JTR 为右上外侧锚点，+o 指定偏移。
legend_position = JTR+o0.2c/0.2c
# GMT 面板样式，例如 +gwhite+p0.8p 为白底加边线；留空可去除面板。
legend_box = +gwhite+p0.8p
# 图例字体，留空沿用主刻度的默认字体。
legend_font =
# 图例中四组序列的名称，仅在 add_legend=true 时使用。
defo_legend_label = Deformation
fit_legend_label = Fitted deformation
precip_legend_label = Precipitation
temperature_legend_label = Temperature

# Shared font suffixes: font_title, font_annot_primary, font_label.
# 共享字体后缀：font_title、font_annot_primary、font_label。
# 标题字体，仅在 title 非空时显示。
default_font_title = 14p,Helvetica-Bold
# 默认数值刻度字体；主时间轴的日期由 primary_time_font 控制。
default_font_annot_primary = 11p,Helvetica
# 次时间轴上的年份字体。
default_font_annot_secondary = 14p,Helvetica
# 默认轴名的字号、字体及颜色。
default_font_label = 11p,Helvetica
