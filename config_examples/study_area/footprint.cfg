# 通用研究区、科学图层、数据 footprint 与定位插图配置示例。
# figure.* section 按文件中出现的先后顺序绘制；后面的图层覆盖前面的图层。
#
# 运行方式（在 Geodesy-Visualization 仓库根目录执行）：
# 1. 仅检查配置、数据路径和绘图顺序：
#    conda run -n envPlot geodesy-visualization study-area --config config_examples/study_area/footprint.cfg --dry-run
# 2. 正式绘图：
#    conda run -n envPlot geodesy-visualization study-area --config config_examples/study_area/footprint.cfg
#
# 长度单位：c=厘米，p=点；经纬度单位为度；k=千米。
# 所有相对路径均以本 CFG 所在目录为基准解析。

[project]
# 项目输出根目录；“.”表示本 CFG 所在目录，最终输出不得越过此目录。
processing_root = .

[figure]
# 页面布局；publication_sidecar 在主图右侧保留 inset 和图例信息栏。
layout = publication_sidecar

[figure.basemap]
# 主图范围，依次为 west,east,south,north。
region = 12.8, 14.0, 42.6, 43.4
# Mercator 投影，主图宽度为 16 cm。
projection = M16c
# af 表示自动生成坐标轴注记和主、次刻度。
frame = af
# 主图标题。
title = Study Area and Data Footprints
# 标题字体：字号、字体族和字重。
font_title = 28p,Helvetica-Bold
# 经纬度坐标轴注记字体。
font_annot_primary = 14p,Helvetica-Bold
# 坐标轴标签字体。
font_label = 28p,Helvetica-Bold

[figure.grdimage.dem]
# DEM 栅格输入；相对路径从本 CFG 目录解析。
grid = ../deformation_map/data/dem.tif
# DEM 使用的 GMT 色标。
cmap = gray
# 色标范围：最小值/最大值/采样间隔。
series = 0/5000/1000
# yes 创建连续 CPT，避免色标显示为离散色块。
continuous = yes
# +d 根据 DEM 自动计算地形明暗阴影。
shading = +d

[figure.plot.faults]
# 包含线状断层和运动学属性的矢量数据。
data = data/faults.geojson
# 用于区分逆、正、走滑和其他断层的属性字段。
kinematic_field = kinematics
# 已识别断层类型的默认线样式。
pen = 1.5p,black
# 无法分类断层的回退线样式。
fallback_pen = 1p,gray50

[figure.plot.footprint.reference]
# 主影像或参考产品的 KML footprint。
data = data/reference_footprint.kml
# 主影像 footprint 的线宽和颜色。
pen = 3p,red
# 主影像在自动图例中的名称。
label = Reference image footprint

[figure.plot.footprint.slaves]
# 从影像或其他产品 footprints 的 KML，可包含多个多边形。
data = data/slave_footprints.kml
# 从影像 footprints 的线宽和颜色。
pen = 2p,blue
# 从影像在自动图例中的名称。
label = Slave image footprints

[figure.meca.mainshock]
# 事件经度。
longitude = 13.45
# 事件纬度。
latitude = 42.95
# Aki 震源机制走向角，单位为度。
strike = 155
# Aki 震源机制倾角，单位为度。
dip = 47
# Aki 震源机制滑动角，单位为度。
rake = -87
# 矩震级；用于确定 beachball 的相对尺度。
magnitude = 6.0
# 震源深度，单位为 km。
depth_km = 8.0
# 震源机制符号直径。
scale = 0.6c
# 压缩象限填充色。
compressionfill = black
# 张裂象限填充色。
extensionfill = white
# 震源机制轮廓线样式。
pen = 1p,black

[figure.scalebar]
# 比例尺位于主图右上方外侧；JTR/jBR 为锚点，o 为水平/垂直偏移。
position = JTR+jBR+o0c/3.8c
# 比例尺代表 50 km。
length = 50k
# yes 使用黑白交替分段比例尺。
fancy = yes
# yes 显示距离单位。
unit = yes
# 比例尺尺条本体高度；不改变文字字号。
map_scale_height = 20p
# 比例尺数值注记字体。
font_annot_primary = 14p,Helvetica-Bold
# 比例尺标签字体。
font_label = 14p,Helvetica-Bold

[figure.directional_rose]
# 指北针位于主图左上方外侧。
position = JTL+jBL+o0.5c/2.2c
# 指北针整体宽度。
width = 2c
# f 使用 fancy directional rose 样式。
kind = f

[figure.colorbar.dem]
# 使用 figure.grdimage.dem 创建的连续 CPT。
source = figure.grdimage.dem
# 色标位于主图底部中央。
position = BC
# 水平色标长度。
length = 8c
# 色标厚度。
width = 0.35c
# horizontal 表示水平色标。
orientation = horizontal
# 色标物理量名称。
label = Elevation
# 色标数据单位。
unit = m
# 数值注记间隔。
annot = 1000
# 小刻度间隔。
tick = 1000
# 色标数值注记字体。
font_annot_primary = 10p,Helvetica-Bold
# 色标名称和单位字体。
font_label = 12p,Helvetica-Bold

[figure.inset.globe]
# 全球定位图相对主图右上角的位置。
position = JTR+jTL+o0.8c/0c
# 全球定位图宽度。
width = 4c
# 高亮的 DCW 国家代码；IT 表示意大利。
highlight = IT
# 普通陆地填充色。
land = gray90
# 海洋填充色。
water = white
# 目标国家填充色。
highlight_fill = gray
# yes 绘制全球经纬网。
show_grid = yes

[figure.inset.regional]
# 区域定位图相对主图右上角的位置。
position = JTR+jTL+o0.8c/-4.8c
# 区域定位图宽度。
width = 5c
# 需要高亮的 DCW 国家或行政区代码。
regions = IT
# 所选区域外增加的经纬度缓冲。
buffer = 3
# 普通陆地填充色。
land = gray90
# 水域填充色。
water = white
# 目标区域填充色。
highlight_fill = gray
# 目标区域边界线样式。
highlight_pen = 0.8p,white

[figure.legend]
# 图例位于页面底部中央。
position = BC
# no 表示不绘制图例背景和外接边框。
box = no
# 图例布局宽度。
width = 11c
# automatic 按前面科学图层的顺序自动汇总图例。
mode = automatic
# 图例文字字体。
font = 10p,Helvetica-Bold
# 相邻图例条目之间的垂直空隙。
row_gap = 0.1c
# 符号相对于图例左边界的水平偏移。
symbol_offset = 1.8c
# 断层和 footprint 图例线段长度。
line_length = 3c
# 断层三角齿或走滑箭头沿线的中心间距。
front_spacing = 1c
# 断层三角齿或走滑箭头大小。
front_size = 0.25c
# 图例文字列相对于符号参考点的水平偏移。
text_offset = 4c

[figure.savefig]
# 输出图片；相对路径从本 CFG 所在目录解析。
fname = result/study_area.png
# 输出栅格分辨率，单位为 dpi。
dpi = 300
# yes 自动裁除画布外围多余空白。
crop = yes
# 自动裁切后在图件四周保留的安全边距。
canvas_margin = 0.4c
