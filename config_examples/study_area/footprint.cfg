# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：Study area and footprints / 研究区与影像覆盖
# RUN / 运行：在仓库根目录使用 envPlot；从其他目录运行时填写 CFG 的绝对路径。
# 1. 仅检查配置、数据路径和绘图顺序：
#    conda run -n envPlot geodesy-visualization study-area --config config_examples/study_area/footprint.cfg --dry-run
# 2. 正式绘图：
#    conda run -n envPlot geodesy-visualization study-area --config config_examples/study_area/footprint.cfg
# INPUTS / 输入：按 figure.* 顺序读取地形、断层、影像 footprint 和标注。
# OUTPUTS / 输出：figure.savefig 指定的研究区图。
# RERUN / 重跑：绘制成功后替换同名图片。

# 通用研究区、科学图层、数据 footprint 与定位插图配置示例。
# figure.* section 按文件中出现的先后顺序绘制；后面的图层覆盖前面的图层。
#
#
# 长度单位：c=厘米，p=点；经纬度单位为度；k=千米。
# 所有相对路径均以本 CFG 所在目录为基准解析。
# 布尔开关不区分大小写。真值为 true/yes/on/1，假值为 false/no/off/0。
# Boolean switches ignore case. True values are true/yes/on/1, and false values are false/no/off/0.

[project]
# 项目输出根目录；“.”表示本 CFG 所在目录，最终输出不得越过此目录。
processing_root = .

[figure]
# 唯一支持的布局为 publication_sidecar，在主图右侧保留插图和图例信息栏。
layout = publication_sidecar

[figure.basemap]
# 主图范围，依次为 west,east,south,north。
region = 12.8, 14.0, 42.6, 43.4
# Mercator 投影，主图宽度为 16 cm。
projection = M16c
# af 表示自动生成坐标轴注记和主、次刻度。
frame = af
# 主图标题。
title = Study Area and Data Footprints
# 标题的 GMT 字体，格式为 字号,字体名[,颜色]。Helvetica-Bold 为粗体。
font_title = 28p,Helvetica-Bold
# 经纬度坐标轴注记字体。
font_annot_primary = 14p,Helvetica-Bold
# 横纵轴名称字体。设置 x_label 或 y_label 后显示对应轴名。
font_label = 28p,Helvetica-Bold
# 可选的横轴和纵轴名称；留空不绘制。
x_label =
y_label =
# 轴名相对边框的水平/垂直偏移，负数分别向左和向下。
x_label_offset = 0c/-1c
y_label_offset = -2.3c/0c
# GMT 经纬度格式；可取消注释设为度分秒。
# format_geo_map = ddd:mm:ss
# GMT 地图边框类型可用 fancy、fancy-rounded（亦可写 fancy+）、plain 或 inside。
# graph 和 graph-origin 用于笛卡尔投影。省略时由当前 GMT 主题决定。
# map_frame_type = fancy
# 花式边框宽度为正长度，如 6p；auto 由 GMT 按图幅尺寸缩放。
# map_frame_width = 6p
# 普通边框画笔和刻度画笔用 线宽[,颜色[,线型]]，也可用 GMT 的 auto。
# map_frame_pen = 3p,black
# map_tick_pen = 1p,black
# 边框透明度，0 为不透明，100 为全透明。
# transparency = 0

[figure.grdimage.dem]
# DEM 栅格输入；相对路径从本 CFG 目录解析。
grid = ../deformation_profile/data/DEM.tif
# DEM 使用的 GMT 色标。
cmap = gray
# 色标范围：最小值/最大值/采样间隔。
series = 0/5000/1000
# yes 创建连续 CPT，须同时设置 series；no（默认）让 GMT 使用原有色表类型。
continuous = yes
# +d 根据 DEM 自动计算地形明暗阴影。
shading = +d
# 可选裁剪范围和投影，默认沿用主图。frame 可为这层额外绘制边框。
# region = 12.8, 14.0, 42.6, 43.4
# projection = M16c
# frame = af
# 栅格绘制分辨率（dpi）和透明度百分比。
# dpi = 300
# transparency = 0
# monochrome=true 转为灰度，false（默认）保留颜色。
# monochrome = false
# no_clip=true 保留地图边界外的像素，false（默认）裁剪。
# no_clip = false
# true 将 NaN 网格值设为透明；false（默认）使用普通绘制。也可用 GMT -Q
# 字符串，例如影像用 white 指定透明色，网格用 +z0 指定与数值 0 映射的颜色。
# nan_transparent = true

[figure.plot.faults]
# 包含线状断层和运动学属性的矢量数据。
data = data/faults.geojson
# 用于区分逆、正、走滑和其他断层的属性字段。
kinematic_field = kinematics
# 已识别断层类型的默认线样式。
pen = 1.5p,black
# 无法分类断层的回退线样式。
fallback_pen = 1p,gray50
# true（默认）绘制断层和对应图例项；false 跳过二者。
# enabled = true
# 整体透明度（0–100）。
# transparency = 0
# 逆断层、正断层、走滑断层各自的线宽、符号和填充。
# f0.8c/0.3c 表示齿间距 0.8 cm、大小 0.3 cm，+l/+r 指两侧。
# reverse_pen = 1.5p,black
# reverse_style = f0.8c/0.3c+r+t
# reverse_fill = white
# normal_pen = 1.5p,black
# normal_style = f0.8c/0.3c+l+t
# normal_fill = black
# strike_slip_pen = 1.5p,black
# strike_slip_style = f0.8c/0.3c+l+s
# strike_slip_fill = black
# 四类断层在图例中的显示名称。
# label_reverse = Reverse fault
# label_normal = Normal fault
# label_strike_slip = Strike-slip fault
# label_other = Other fault

[figure.plot.footprint.reference]
# 主影像或参考产品的 KML footprint。
data = data/reference_footprint.kml
# 主影像 footprint 的线宽和颜色。
pen = 3p,red
# 主影像在自动图例中的名称。
label = Reference image footprint
# true（默认）显示轮廓和对应图例项；false 跳过二者。
# enabled = true
# 可选填充和透明度（0–100）。
# fill = red@90
# transparency = 0
# close=true 将线段作为闭合多边形绘制；false（默认）按常规线段绘制。
# close = true
# no_clip=true 保留地图边界外的数据；false（默认）按 GMT 正常裁剪。
# no_clip = false

[figure.plot.footprint.slaves]
# 从影像或其他产品 footprints 的 KML，可包含多个多边形。
data = data/slave_footprints.kml
# 从影像 footprints 的线宽和颜色。
pen = 2p,blue
# 从影像在自动图例中的名称。
label = Slave image footprints
# true（默认）显示轮廓和对应图例项；false 跳过二者。
# enabled = true
# 可选填充和透明度（0–100）。
# fill = blue@90
# transparency = 0
# close=true 将线段作为闭合多边形绘制；false（默认）按常规线段绘制。
# close = true
# no_clip=true 保留地图边界外的数据；false（默认）按 GMT 正常裁剪。
# no_clip = false

[figure.meca.mainshock]
# 事件经度。
longitude = 13.45
# 事件纬度。
latitude = 42.95
# Aki 震源机制走向角，单位为度。
strike = 155
# Aki 震源机制倾角，单位为度。
dip = 47
# Aki 震源机制滑动角，单位为度。
rake = -87
# 矩震级；用于确定 beachball 的相对尺度。
magnitude = 6.0
# 震源深度，单位为 km。
depth_km = 8.0
# 震源机制符号直径。
scale = 0.6c
# 压缩象限填充色。
compressionfill = black
# 张裂象限填充色。
extensionfill = white
# 震源机制轮廓线样式。
pen = 1p,black
# true（默认）绘制震源机制；false 跳过。
# enabled = true
# 透明度百分比。
# transparency = 0
# 可选震源名称；字体可通过 scale 的 +f字号,字体,颜色 修饰。
# label = Main shock

[figure.scalebar]
# 比例尺位于主图右上方外侧；JTR/jBR 为锚点，o 为水平/垂直偏移。
position = JTR+jBR+o0c/3.8c
# 比例尺代表 50 km。
length = 50k
# yes 使用交替分段比例尺；no（默认）使用普通比例尺。
fancy = yes
# yes 使用 GMT 的距离单位缩写；no（默认）使用 GMT 的默认标注。
unit = yes
# 比例尺尺条本体高度；不改变文字字号。
map_scale_height = 20p
# 可选的独立比例尺标签。
# label = Distance
# 标签对齐可用 l（左）、r（右）、t（上，默认）或 b（下）。
# label_alignment = t
# box 可用 true 启用默认面板、false（默认）关闭，或 GMT 面板样式。
# box = F+gwhite+p1p,black+c6p
# 比例尺数值注记字体。
font_annot_primary = 14p,Helvetica-Bold
# 比例尺标签字体。
font_label = 14p,Helvetica-Bold
# true（默认）绘制比例尺；false 跳过。
# enabled = true
# 比例尺换算采用的纬度，或 lon/lat。省略时 GMT 按比例尺位置确定。
# scale_loc = 42.95
# 面板组件的透明度百分比。
# transparency = 0
# height 和 vertical 需要支持它们的 PyGMT scalebar 接口；envPlot 用 map_scale_height。
# vertical 为布尔值，true 仅用于笛卡尔比例尺，false 为水平比例尺。

[figure.directional_rose]
# 指北针位于主图左上方外侧。
position = JTL+jBL+o0.5c/2.2c
# 指北针整体宽度。
width = 2c
# 省略 kind 使用普通指北针。f 或 f1 绘制四向，f2 和 f3 逐级增加方位。
kind = f
# 方位文字按 西、东、南、北 排列；省略则不绘制方位文字，北方用 * 可画北极星。
# labels = W,E,S,N
# 方位文字的字号；如需显示文字，启用上方 labels。字形由 GMT 固定。
# label_size = 12p
# box 可用 true 启用默认面板、false（默认）关闭，或 GMT 面板样式。
# box = F+gwhite+p1p,black
# true（默认）绘制指北针；false 跳过。
# enabled = true
# 额外偏移（横/纵）及透明度百分比。
# offset = 0c/0c
# transparency = 0
# intervals 适用于支持该参数的新版 PyGMT directional_rose 接口。

[figure.colorbar.dem]
# 引用上游最近绘制的 figure.grdimage.*，在下一栅格替换它之前绘制色标。
source = figure.grdimage.dem
# 色标位于主图底部外侧；+o0c/2.8c 为可选轴名留出空间。
position = JBC+o0c/2.8c
# 色标长度。GMT 也支持以负长度指定反向。
length = 8c
# 色标厚度。
width = 0.35c
# horizontal（默认）为水平色标，vertical 为垂直色标。不区分大小写。
orientation = horizontal
# 色标物理量名称。
label = Elevation
# 色标数据单位。
unit = m
# 数值注记间隔。
annot = 1000
# 小刻度间隔。
tick = 1000
# 色标数值注记字体。
font_annot_primary = 10p,Helvetica-Bold
# 色标名称和单位字体。
font_label = 12p,Helvetica-Bold
# true（默认）绘制色标；false 跳过。
# enabled = true
# 色标透明度百分比。
# transparency = 0
# 可选独立 CPT；通常直接使用上游 source 创建的 CPT。
# cmap = gray
# true 反转色标方向；false（默认）保留设置的长度和方向。
# reverse = false
# 色标上的网格间隔，单位与 DEM 一致。
# grid = 1000
# box 可用 true 启用默认面板、false（默认）关闭，或 GMT 面板样式。
# box = +gwhite+p1p+c6p

[figure.inset.globe]
# 全球定位图相对主图右上角的位置。
position = JTR+jTL+o0.8c/0c
# 全球定位图宽度。
width = 4c
# 高亮的 DCW 国家代码；IT 表示意大利。
highlight = IT
# 普通陆地填充色。
land = gray90
# 海洋填充色。
water = white
# 目标国家填充色。
highlight_fill = gray
# yes（默认）绘制全球经纬网；no 隐藏。
show_grid = yes
# true（默认）绘制插图；false 跳过。
# enabled = true
# 省略高度时由投影决定。
# height = 4c
# box 可用 true 启用默认面板、false（默认）关闭，或 GMT 面板样式。
# box = +gwhite+p0.5p
# 研究区中心标记的符号、填充、描边。
# marker_style = a0.3c
# marker_fill = red
# marker_pen = 0.4p,white

[figure.inset.regional]
# 区域定位图相对主图右上角的位置。
position = JTR+jTL+o0.8c/-4.8c
# 区域定位图宽度。
width = 5c
# 需要高亮的 DCW 国家或行政区代码。
regions = IT
# 所选区域外增加的经纬度缓冲。
buffer = 3
# 普通陆地填充色。
land = gray90
# 水域填充色。
water = white
# 目标区域填充色。
highlight_fill = gray
# 目标区域边界线样式。
highlight_pen = 0.8p,white
# true（默认）绘制插图；false 跳过。
# enabled = true
# 省略高度时由投影决定。
# height = 4c
# box 可用 true 启用默认面板、false（默认）关闭，或 GMT 面板样式。
# box = +gwhite+p0.5p
# 研究区中心标记的符号、填充、描边。
# marker_style = a0.3c
# marker_fill = red
# marker_pen = 0.4p,white

[figure.legend]
# 图例放在主图右下方外侧，避开影像、断层和下面的色标。
position = JBR+jBL+o0.7c/0c
# yes（默认）绘制白底和边框；no 关闭面板；也可填 GMT 样式如 +gwhite+p1p。
box = no
# 图例布局宽度。
width = 11c
# 唯一支持的模式为 automatic（默认），按前面科学图层的顺序自动汇总图例。
mode = automatic
# 图例文字字体。
font = 10p,Helvetica-Bold
# 相邻图例条目之间的垂直空隙。
row_gap = 0.1c
# 符号相对于图例左边界的水平偏移。
symbol_offset = 1.8c
# 断层和 footprint 图例线段长度。
line_length = 3c
# 断层三角齿或走滑箭头沿线的中心间距。
front_spacing = 1c
# 断层三角齿或走滑箭头大小。
front_size = 0.25c
# 图例文字列相对于符号参考点的水平偏移。
text_offset = 4c
# true（默认）绘制图例；false 跳过。
# enabled = true
# padding 仅在启用外接框时控制框内边距。
# padding = 5p

[figure.savefig]
# 输出图片；相对路径从本 CFG 所在目录解析。
# 文件扩展名决定 GMT 输出格式，例如 .png、.pdf、.eps、.jpg、.bmp 或 .tif。
fname = result/study_area.png
# 输出栅格分辨率，单位为 dpi。
dpi = 300
# yes（默认）自动裁除画布外围多余空白；no 保留原画布。
crop = yes
# 自动裁切后在图件四周保留的安全边距。
canvas_margin = 0.4c
# true 生成透明背景，适用于 PNG；false（默认）使用普通背景。
# transparent = false
